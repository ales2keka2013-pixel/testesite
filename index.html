<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Presente Ideal</title>
</head>

<body>

  <option value="feminino">Feminino</option>

</select><br><br>

</select><br><br>

<select id="preco">

</select><br><br>

<div id="resultado"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwV-N476BVfkBkokYt1Brwf8rBKRNYdOK-4AowKEHdfa0lnVLTMIQFQOg1O0K8Ms6dZ/exec";

produtos.forEach((produto, index) => {
  resultado.innerHTML += `
    <div style="margin-top:20px; border:1px solid #ccc; padding:15px; border-radius:8px;">
      
      ${index === 0 ? "<strong style='color:green;'>Mais recomendado</strong><br>" : ""}

      <p>${produto.descricao || ""}</p>
      
      <p><strong>Até R$ ${produto.preco_max}</strong></p>
