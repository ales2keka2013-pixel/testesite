<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Presente Ideal</title>
</head>

<body>

<h2>Descubra o Presente Ideal 🎁</h2>

<input type="number" id="idade" placeholder="Idade"><br><br>

<select id="genero">
  <option value="">Gênero</option>
  <option value="masculino">Masculino</option>
  <option value="feminino">Feminino</option>
  <option value="unissex">Unissex</option>
</select><br><br>

<select id="categoria">
  <option value="">Categoria</option>
  <option value="tecnologia">Tecnologia</option>
  <option value="livros">Livros</option>
  <option value="esportes">Esportes</option>
</select><br><br>

<select id="preco">
  <option value="100">Até 100</option>
  <option value="200">Até 200</option>
  <option value="500">Até 500</option>
</select><br><br>

<button onclick="buscar()">Buscar Presente</button>

<div id="resultado"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwV-N476BVfkBkokYt1Brwf8rBKRNYdOK-4AowKEHdfa0lnVLTMIQFQOg1O0K8Ms6dZ/exec";

async function buscar() {

  const response = await fetch(API_URL);
  const produtos = await response.json();

  console.log("Produtos recebidos:", produtos);

  const resultado = document.getElementById("resultado");
  resultado.innerHTML = "";

  if (!produtos || produtos.length === 0) {
    resultado.innerHTML = "Nenhum produto vindo da planilha.";
    return;
  }

  produtos.forEach((produto) => {
    resultado.innerHTML += `
      <div style="margin-top:20px; border:1px solid #ccc; padding:10px;">
        <h3>${produto.nome}</h3>
        <p>${produto.descricao}</p>
        <p>Até R$ ${produto.preco_max}</p>
      </div>
    `;
  });

}

</script>

</body>
</html>
