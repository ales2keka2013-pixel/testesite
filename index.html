<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Presente Ideal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.form-box {
  background: white;
  padding: 20px;
  border-radius: 10px;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

button {
  background: #000;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 6px;
}

button:hover {
  background: #333;
}

.card {
  background: white;
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  gap: 15px;
  align-items: center;
}

.card img {
  width: 120px;
  border-radius: 8px;
}

.badge {
  background: green;
  color: white;
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 4px;
}
</style>
</head>

<body>

<h2>Descubra o Presente Ideal 🎁</h2>

<div class="form-box">

<input type="number" id="idade" placeholder="Idade">

<select id="genero">
  <option value="">Gênero</option>
  <option value="masculino">Masculino</option>
  <option value="feminino">Feminino</option>
  <option value="unissex">Unissex</option>
</select>

<select id="categoria">
  <option value="">Categoria</option>
  <option value="tecnologia">Tecnologia</option>
  <option value="livros">Livros</option>
  <option value="esportes">Esportes</option>
</select>

<select id="preco">
  <option value="">Faixa de preço</option>
  <option value="100">Até R$100</option>
  <option value="200">Até R$200</option>
  <option value="500">Até R$500</option>
</select>

<button onclick="buscar()">Encontrar Presente</button>

</div>

<div id="resultado"></div>

<script>

const supabase = window.supabase.createClient(
  "COLE_SUA_URL_AQUI",
  "COLE_SUA_CHAVE_AQUI"
);

async function buscar() {

  let idade = parseInt(document.getElementById("idade").value)
  let genero = document.getElementById("genero").value
  let categoria = document.getElementById("categoria").value
  let preco = parseInt(document.getElementById("preco").value)

  let resultado = document.getElementById("resultado")
  resultado.innerHTML = ""

  // 🔎 Validação
  if (!idade || !genero || !categoria || !preco) {
    resultado.innerHTML = "<p>Preencha todos os campos.</p>"
    return
  }

  const { data, error } = await supabase
    .from('produtos')
    .select('*')
    .lte('idade_min', idade)
    .gte('idade_max', idade)
    .lte('preco_max', preco)
    .eq('categoria', categoria)
    .in('genero', [genero, 'unissex'])
    .order('preco_max', { ascending: true })
    .limit(5)

  if (error) {
    resultado.innerHTML = "<p>Erro ao buscar produtos.</p>"
    console.error(error)
    return
  }

  if (!data || data.length === 0) {
    resultado.innerHTML = "<p>Nenhuma sugestão encontrada.</p>"
    return
  }

  data.forEach((produto, index) => {

    resultado.innerHTML += `
      <div class="card">
        <img src="${produto.imagem}" alt="${produto.nome}">
        <div>
          ${index === 0 ? '<div class="badge">Mais recomendado</div>' : ''}
          <h3>${produto.nome}</h3>
          <p>${produto.descricao}</p>
          <p><strong>Até R$ ${produto.preco_max}</strong></p>
          <a href="${produto.link}" target="_blank">
            <button>Comprar Agora</button>
          </a>
        </div>
      </div>
    `
  })

}

</script>

</body>
</html>
