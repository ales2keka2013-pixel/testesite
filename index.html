<script>

async function buscar() {

  let idade = parseInt(document.getElementById("idade").value)
  let genero = document.getElementById("genero").value
  let categoria = document.getElementById("categoria").value
  let preco = parseInt(document.getElementById("preco").value)

  const response = await fetch("COLE_AQUI_LINK_CSV")
  const texto = await response.text()

  const linhas = texto.split("\n").slice(1)
  let resultado = document.getElementById("resultado")
  resultado.innerHTML = ""

  let produtos = linhas.map(linha => {
    let col = linha.split(",")
    return {
      nome: col[0],
      descricao: col[1],
      categoria: col[2],
      idade_min: parseInt(col[3]),
      idade_max: parseInt(col[4]),
      genero: col[5],
      preco_max: parseInt(col[6]),
      imagem: col[7],
      link: col[8]
    }
  })

  let filtrados = produtos
    .filter(p =>
      idade >= p.idade_min &&
      idade <= p.idade_max &&
      preco >= p.preco_max &&
      p.categoria === categoria &&
      (p.genero === genero || p.genero === "unissex")
    )
    .slice(0,5)

  if (filtrados.length === 0) {
    resultado.innerHTML = "Nenhuma sugestão encontrada."
    return
  }

  filtrados.forEach((produto, index) => {
    resultado.innerHTML += `
      <div class="card">
        <img src="${produto.imagem}">
        <div>
          ${index === 0 ? '<div class="badge">Mais recomendado</div>' : ''}
          <h3>${produto.nome}</h3>
          <p>${produto.descricao}</p>
          <p><strong>Até R$ ${produto.preco_max}</strong></p>
          <a href="${produto.link}" target="_blank">
            <button>Comprar Agora</button>
          </a>
        </div>
      </div>
    `
  })
}

</script>
