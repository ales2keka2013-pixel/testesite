<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Busca Presente</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
}

header {
  background: #111;
  color: white;
  text-align: center;
  padding: 25px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.form-box {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  background: #111;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  background: #333;
}

.card {
  background: white;
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  gap: 20px;
  align-items: center;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.card img {
  width: 140px;
  border-radius: 8px;
}

.card-content {
  flex: 1;
}

.badge {
  background: green;
  color: white;
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 4px;
  display: inline-block;
  margin-bottom: 6px;
}

.buy-btn {
  margin-top: 10px;
  background: #007bff;
}

.buy-btn:hover {
  background: #0056b3;
}

@media (max-width: 700px) {
  .card {
    flex-direction: column;
    text-align: center;
  }

  .card img {
    width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎁 Busca Presente</h1>
  <p>Descubra sugestões perfeitas para qualquer ocasião</p>
</header>

<div class="container">

<div class="form-box">
  <input type="number" id="idade" placeholder="Idade">

  <select id="genero">
    <option value="">Gênero</option>
    <option value="masculino">Masculino</option>
    <option value="feminino">Feminino</option>
    <option value="unissex">Unissex</option>
    <option value="unissex">Casamento</option>
  </select>

  <select id="categoria">    
    <option value="">Categoria</option>
    <option value="brinquedos">brinquedos</option>
    <option value="tecnologia">Tecnologia</option>
    <option value="livros">Livros</option>
    <option value="esportes">Esportes</option>
  </select>

  <select id="preco">
    <option value="">Faixa de preço</option>
    <option value="100">Até R$100</option>
    <option value="200">Até R$200</option>
    <option value="500">Até R$500</option>
  </select>

  <button onclick="buscar()">Buscar Presente</button>
</div>

<div id="resultado"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwwxs-lSOCnQ9OKUIC42ZdC87_pGDKYYHPPgnNlt0fLyR-ziQ4bORLJ-3YjY-es5SO2/exec";

async function buscar() {

  const idade = Number(document.getElementById("idade").value);
  const genero = document.getElementById("genero").value;
  const categoria = document.getElementById("categoria").value;
  const preco = Number(document.getElementById("preco").value);

  const resultado = document.getElementById("resultado");

  if (!idade || !genero || !categoria || !preco) {
    resultado.innerHTML = "<p>Preencha todos os campos.</p>";
    return;
  }

  resultado.innerHTML = "Buscando sugestões...";

  try {

    const response = await fetch(API_URL);
    const produtos = await response.json();

    const limparTexto = (texto) => {
      if (!texto) return "";
      return texto.toString().toLowerCase().trim();
    };

    const limparNumero = (valor) => {
      if (!valor) return 0;
      return Number(
        valor.toString()
          .replace("R$", "")
          .replace(",", ".")
          .trim()
      );
    };

    const generoBusca = limparTexto(genero);
    const categoriaBusca = limparTexto(categoria);

    const filtrados = produtos.filter(produto => {

      const idadeMin = limparNumero(produto.idade_min);
      const idadeMax = limparNumero(produto.idade_max);
      const precoMax = limparNumero(produto.preco_max);

      const generoProduto = limparTexto(produto.genero);
      const categoriaProduto = limparTexto(produto.categoria);

      return (
        idade >= idadeMin &&
        idade <= idadeMax &&
        precoMax <= preco &&
        (generoProduto === generoBusca || generoProduto === "unissex") &&
        categoriaProduto === categoriaBusca
      );
    });

    if (filtrados.length === 0) {
      resultado.innerHTML = "<p>Nenhuma sugestão encontrada.</p>";
      return;
    }

    resultado.innerHTML = "";

    filtrados.forEach((produto, index) => {
      resultado.innerHTML += `
        <div class="card">
          ${produto.imagem ? `<img src="${produto.imagem}" alt="${produto.nome}">` : ""}
          <div class="card-content">
            ${index === 0 ? `<div class="badge">Mais recomendado</div>` : ""}
            <h3>${produto.nome}</h3>
            <p>${produto.descricao || ""}</p>
            <p><strong>Até R$ ${produto.preco_max}</strong></p>
            ${produto.link ? `
              <a href="${produto.link}" target="_blank">
                <button class="buy-btn">Comprar Agora</button>
              </a>
            ` : ""}
          </div>
        </div>
      `;
    });

  } catch (erro) {
    console.error(erro);
    resultado.innerHTML = "<p>Erro ao carregar sugestões.</p>";
  }
}

</script>

</body>
</html>
