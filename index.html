<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Busca Presente</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
  padding-top: 90px;
}

/* HEADER FIXO */
header {
  background: #111;
  color: white;
  padding: 15px 30px;
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
  display: flex;
  justify-content: center;
  align-items: center;
}

.header-content {
  text-align: center;
}

.social {
  position: absolute;
  right: 30px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.social span {
  font-size: 14px;
  font-weight: bold;
}

.social a {
  color: white;
  font-size: 18px;
  transition: 0.3s;
}

.social a:hover {
  transform: scale(1.2);
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.form-box {
  background: white;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  gap: 15px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

button {
  background: #111;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  background: #333;
}

/* CARD ANIMADO */
.card {
  background: white;
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  gap: 20px;
  align-items: center;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
  transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

.card img {
  width: 140px;
  border-radius: 8px;
}

.card-content {
  flex: 1;
}

.buy-btn {
  margin-top: 10px;
  background: #007bff;
}

.buy-btn:hover {
  background: #0056b3;
}

/* Compartilhar */
.share-buttons {
  margin-top: 12px;
}

.share-buttons span {
  font-weight: bold;
  font-size: 14px;
}

.buttons-row {
  margin-top: 6px;
  display: flex;
  gap: 8px;
}

.share-buttons button {
  padding: 8px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  color: white;
}

.whatsapp { background: #25D366; }
.facebook { background: #1877F2; }
.copy { background: #6c757d; }

.share-buttons button:hover {
  opacity: 0.85;
}

/* WHATSAPP FLUTUANTE */
.whatsapp-float {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  color: white;
  font-size: 24px;
  padding: 15px;
  border-radius: 50%;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  z-index: 1000;
  transition: 0.3s;
}

.whatsapp-float:hover {
  transform: scale(1.1);
}

/* RODAPÉ */
footer {
  margin-top: 50px;
  background: #111;
  color: white;
  text-align: center;
  padding: 20px;
  font-size: 14px;
}

@media (max-width: 700px) {
  .card {
    flex-direction: column;
    text-align: center;
  }

  .card img {
    width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <h2>🎁 Busca Presente</h2>
    <small>Descubra sugestões perfeitas</small>
  </div>

  <div class="social">
    <span>Siga-nos:</span>
    <a href="https://instagram.com" target="_blank">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://facebook.com" target="_blank">
      <i class="fab fa-facebook"></i>
    </a>
  </div>
</header>

<div class="container">

<div class="form-box">
  <input type="number" id="idade" placeholder="Idade">

  <select id="genero">
    <option value="">Gênero</option>
    <option value="masculino">Masculino</option>
    <option value="feminino">Feminino</option>
    <option value="unissex">Unissex</option>
  </select>

  <select id="categoria">
    <option value="">Categoria</option>
    <option value="brinquedos">Brinquedos</option>
    <option value="tecnologia">Tecnologia</option>
    <option value="livros">Livros</option>
    <option value="esportes">Esportes</option>
    <option value="beleza e cuidado pessoal">Beleza e Cuidado Pessoal</option>
    <option value="ferramentas">Ferramentas</option>
  </select>

  <select id="preco">
    <option value="">Faixa de preço</option>
    <option value="100">Até R$100</option>
    <option value="200">Até R$200</option>
    <option value="500">Até R$500</option>
  </select>

  <button onclick="buscar()">Buscar Presente</button>
</div>

<div id="resultado"></div>

</div>

<a href="https://wa.me/" target="_blank" class="whatsapp-float">
  <i class="fab fa-whatsapp"></i>
</a>

<footer>
  © 2026 Busca Presente | Todos os direitos reservados
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwwxs-lSOCnQ9OKUIC42ZdC87_pGDKYYHPPgnNlt0fLyR-ziQ4bORLJ-3YjY-es5SO2/exec";

async function buscar() {
  const idade = Number(document.getElementById("idade").value);
  const genero = document.getElementById("genero").value;
  const categoria = document.getElementById("categoria").value;
  const preco = Number(document.getElementById("preco").value);
  const resultado = document.getElementById("resultado");

  if (!idade || !genero || !categoria || !preco) {
    resultado.innerHTML = "<p>Preencha todos os campos.</p>";
    return;
  }

  resultado.innerHTML = "Buscando sugestões...";

  try {
    const response = await fetch(API_URL);
    const produtos = await response.json();

    const limparTexto = t => (t || "").toString().toLowerCase().trim();
    const limparNumero = v => Number((v || 0).toString().replace("R$", "").replace(",", ".").trim());

    const generoBusca = limparTexto(genero);
    const categoriaBusca = limparTexto(categoria);

    const filtrados = produtos.filter(produto => {
      const idadeMin = limparNumero(produto.idade_min);
      const idadeMax = limparNumero(produto.idade_max);
      const precoMax = limparNumero(produto.preco_max);

      const generoProduto = limparTexto(produto.genero);
      const categoriaProduto = limparTexto(produto.categoria);

      const generoValido =
        generoBusca === "unissex"
          ? true
          : generoProduto === generoBusca || generoProduto === "unissex";

      return (
        idade >= idadeMin &&
        idade <= idadeMax &&
        precoMax <= preco &&
        generoValido &&
        categoriaProduto === categoriaBusca
      );
    });

    if (!filtrados.length) {
      resultado.innerHTML = "<p>Nenhuma sugestão encontrada.</p>";
      return;
    }

    resultado.innerHTML = "";

    filtrados.slice(0,5).forEach(produto => {
      resultado.innerHTML += `
        <div class="card">
          ${produto.imagem ? `<img src="${produto.imagem}" alt="${produto.nome}">` : ""}
          <div class="card-content">
            <h3>${produto.nome}</h3>
            <p>${produto.descricao || ""}</p>
            <p><strong>Até R$ ${produto.preco_max}</strong></p>

            <a href="${produto.link}" target="_blank">
              <button class="buy-btn">Comprar Agora</button>
            </a>

            <div class="share-buttons">
              <span>Compartilhar:</span>
              <div class="buttons-row">
                <button class="whatsapp"><i class="fab fa-whatsapp"></i></button>
                <button class="facebook"><i class="fab fa-facebook-f"></i></button>
                <button class="copy"><i class="fas fa-link"></i></button>
              </div>
            </div>
          </div>
        </div>
      `;
    });

  } catch {
    resultado.innerHTML = "<p>Erro ao carregar sugestões.</p>";
  }
}
</script>

</body>
</html>
