<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Presente Ideal</title>
</head>

<body>

<h2>Descubra o Presente Ideal 🎁</h2>

<input type="number" id="idade" placeholder="Idade"><br><br>

<select id="genero">
  <option value="">Gênero</option>
  <option value="masculino">Masculino</option>
  <option value="feminino">Feminino</option>
  <option value="unissex">Unissex</option>
</select><br><br>

<select id="categoria">
  <option value="">Categoria</option>
  <option value="tecnologia">Tecnologia</option>
  <option value="livros">Livros</option>
  <option value="esportes">Esportes</option>
</select><br><br>

<select id="preco">
  <option value="100">Até 100</option>
  <option value="200">Até 200</option>
  <option value="500">Até 500</option>
</select><br><br>

<button onclick="buscar()">Buscar Presente</button>

<div id="resultado"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwV-N476BVfkBkokYt1Brwf8rBKRNYdOK-4AowKEHdfa0lnVLTMIQFQOg1O0K8Ms6dZ/exec";

async function buscar() {

  const idade = parseInt(document.getElementById("idade").value);
  const genero = document.getElementById("genero").value;
  const categoria = document.getElementById("categoria").value;
  const preco = parseInt(document.getElementById("preco").value);

  // 👇 AQUI ESTÁ O FETCH
  const response = await fetch(API_URL);
  const produtos = await response.json();

  console.log("Produtos recebidos:", produtos);

  const filtrados = produtos.filter(produto =>
    idade >= Number(produto.idade_min) &&
    idade <= Number(produto.idade_max) &&
    Number(produto.preco_max) <= preco &&
    produto.categoria.toLowerCase() === categoria.toLowerCase() &&
    (produto.genero.toLowerCase() === genero.toLowerCase() || produto.genero.toLowerCase() === "unissex")
  );

  const resultado = document.getElementById("resultado");
  resultado.innerHTML = "";

  if (filtrados.length === 0) {
    resultado.innerHTML = "Nenhuma sugestão encontrada.";
    return;
  }

  filtrados.forEach((produto, index) => {
    resultado.innerHTML += `
      <div style="margin-top:20px; border:1px solid #ccc; padding:10px;">
        ${index === 0 ? "<strong>Mais recomendado</strong><br>" : ""}
        <h3>${produto.nome}</h3>
        <p>${produto.descricao}</p>
        <p>Até R$ ${produto.preco_max}</p>
        <a href="${produto.link}" target="_blank">
          <button>Comprar</button>
        </a>
      </div>
    `;
  });

}

</script>

</body>
</html>
