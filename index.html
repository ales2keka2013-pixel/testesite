<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presente Ideal 🎁</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h2 {
  text-align: center;
}

.form-box {
  background: white;
  padding: 20px;
  border-radius: 10px;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

button {
  background: #000;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 6px;
}

button:hover {
  background: #333;
}

.card {
  background: white;
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  gap: 15px;
  align-items: center;
}

.card img {
  width: 120px;
  border-radius: 8px;
}

.badge {
  background: green;
  color: white;
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 4px;
}
</style>
</head>

<body>

<h2>Descubra o Presente Ideal 🎁</h2>

<div class="form-box">

<input type="number" id="idade" placeholder="Idade">

<select id="genero">
  <option value="">Gênero</option>
  <option value="masculino">Masculino</option>
  <option value="feminino">Feminino</option>
  <option value="unissex">Unissex</option>
</select>

<select id="categoria">
  <option value="">Categoria</option>
  <option value="tecnologia">Tecnologia</option>
  <option value="livros">Livros</option>
  <option value="esportes">Esportes</option>
  <option value="brinquedos">Brinquedos</option>
</select>

<select id="preco">
  <option value="100">Até R$100</option>
  <option value="200">Até R$200</option>
  <option value="500">Até R$500</option>
</select>

<button onclick="buscar()">Encontrar Presente</button>

</div>

<div id="resultado"></div>

<script>

const URL_API = "https://script.google.com/macros/s/AKfycbwV-N476BVfkBkokYt1Brwf8rBKRNYdOK-4AowKEHdfa0lnVLTMIQFQOg1O0K8Ms6dZ/exec";

async function buscar() {

  const idade = parseInt(document.getElementById("idade").value);
  const genero = document.getElementById("genero").value;
  const categoria = document.getElementById("categoria").value;
  const preco = parseInt(document.getElementById("preco").value);

  const resultado = document.getElementById("resultado");
  resultado.innerHTML = "Carregando...";

  try {

    const response = await fetch(URL_API);
    const produtos = await response.json();

    const filtrados = produtos.filter(produto => {

      const idadeMin = Number(produto.idade_min || 0);
      const idadeMax = Number(produto.idade_max || 0);
      const precoMax = Number(produto.preco_max || 0);

      const generoProduto = (produto.genero || "")
        .toString()
        .toLowerCase()
        .trim();

      const categoriaProduto = (produto.categoria || "")
        .toString()
        .toLowerCase()
        .trim();

      const generoBusca = genero.toLowerCase().trim();
      const categoriaBusca = categoria.toLowerCase().trim();

      const generoValido =
        generoBusca === "unissex"
          ? true
          : generoProduto === generoBusca || generoProduto === "unissex";

      return (
        idade >= idadeMin &&
        idade <= idadeMax &&
        precoMax <= preco &&
        generoValido &&
        categoriaProduto === categoriaBusca
      );
    });

    resultado.innerHTML = "";

    if (filtrados.length === 0) {
      resultado.innerHTML = "<p>Nenhuma sugestão encontrada.</p>";
      return;
    }

    filtrados.slice(0,5).forEach((produto, index) => {

      resultado.innerHTML += `
        <div class="card">
          <img src="${produto.imagem}" alt="${produto.nome}">
          <div>
            ${index === 0 ? '<div class="badge">Mais recomendado</div>' : ''}
            <h3>${produto.nome}</h3>
            <p>${produto.descricao}</p>
            <p><strong>Até R$ ${produto.preco_max}</strong></p>
            <a href="${produto.link}" target="_blank">
              <button>Comprar Agora</button>
            </a>
          </div>
        </div>
      `;
    });

  } catch (erro) {
    resultado.innerHTML = "<p>Erro ao carregar sugestões.</p>";
    console.error(erro);
  }
}

</script>

</body>
</html>
