<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<!-- CORREÇÃO DO ZOOM MOBILE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Busca Presente - sugestoes de presentes</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
}

header {
  background: #111;
  color: white;
  padding: 25px;
  position: relative;
}

header h1, header p {
  text-align: center;
  margin: 0;
}

header p {
  margin-top: 5px;
}

/* Redes sociais - lado direito */
.social {
  position: absolute;
  top: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.social span {
  font-size: 14px;
  font-weight: bold;
}

.social a {
  color: white;
  font-size: 20px;
  transition: 0.3s;
}

.social a:hover {
  transform: scale(1.2);
}

/* Container */
.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.form-box {
  background: white;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* CAMPOS CORRIGIDOS PARA EVITAR ZOOM */
input, select, button {
  width: 100%;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  box-sizing: border-box;
  font-size: 16px; /* evita zoom no mobile */
}

button {
  background: #111;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  background: #333;
}

.card {
  background: white;
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  gap: 20px;
  align-items: center;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.card img {
  width: 140px;
  height: 140px;
  object-fit: contain;
  border-radius: 8px;
}

.card-content {
  flex: 1;
}

.badge {
  background: green;
  color: white;
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 4px;
  display: inline-block;
  margin-bottom: 6px;
}

.buy-btn {
  margin-top: 10px;
  background: #007bff;
}

.buy-btn:hover {
  background: #0056b3;
}

/* Compartilhar */
.share-buttons {
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.share-buttons span {
  font-weight: bold;
  font-size: 14px;
}

.share-buttons .buttons-row {
  display: flex;
  gap: 8px;
}

.share-buttons button {
  width: auto;
  padding: 8px 12px;
  font-size: 14px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  color: white;
}

.whatsapp { background: #25D366; }
.facebook { background: #1877F2; }
.copy { background: #6c757d; }

.share-buttons button:hover {
  opacity: 0.85;
}

/* MOBILE */
@media (max-width: 700px) {
  .card {
    flex-direction: column;
    text-align: center;
  }

  .card img {
    width: 180px;
    height: 180px;
    max-width: 80%;
    object-fit: contain;
    margin: 0 auto;
    display: block;
  }
}
</style>
</head>

<body>

<header>
  <div class="social">
    <span>Siga-nos:</span>
    <a href="https://instagram.com" target="_blank">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://facebook.com" target="_blank">
      <i class="fab fa-facebook"></i>
    </a>
  </div>

  <h1>🎁 Busca Presente</h1>
  <p>Descubra sugestões perfeitas para qualquer ocasião</p>
</header>

<div class="container">

<div class="form-box">
  <input type="number" id="idade" placeholder="Idade">

  <select id="genero">
    <option value="">Gênero</option>
    <option value="masculino">Masculino</option>
    <option value="feminino">Feminino</option>
    <option value="unissex">Unissex</option>
  </select>

  <select id="categoria">
    <option value="">Categoria</option>
    <option value="brinquedos">Brinquedos</option>
    <option value="tecnologia">Tecnologia</option>
    <option value="livros">Livros</option>
    <option value="esportes">Esportes</option>
    <option value="beleza e cuidado pessoal">Beleza e Cuidado Pessoal</option>
    <option value="ferramentas">Ferramentas</option>
    <option value="casa">Casa</option>
  </select>

  <select id="preco">
    <option value="">Faixa de preço</option>
    <option value="100">Até R$100</option>
    <option value="200">Até R$200</option>
    <option value="500">Até R$500</option>
    <option value="1000">Até R$1000</option>
  </select>

  <button onclick="buscar()">Buscar Presente</button>
</div>

<div id="resultado"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwwxs-lSOCnQ9OKUIC42ZdC87_pGDKYYHPPgnNlt0fLyR-ziQ4bORLJ-3YjY-es5SO2/exec";

async function buscar() {

  const idade = Number(document.getElementById("idade").value);
  const genero = document.getElementById("genero").value;
  const categoria = document.getElementById("categoria").value;
  const preco = Number(document.getElementById("preco").value);

  const resultado = document.getElementById("resultado");

  if (!idade || !genero || !categoria || !preco) {
    resultado.innerHTML = "<p>Preencha todos os campos.</p>";
    return;
  }

  resultado.innerHTML = "Buscando sugestões...";

  try {

    const response = await fetch(API_URL);
    const produtos = await response.json();

    const limparTexto = t => (t || "").toString().toLowerCase().trim();
    const limparNumero = v => Number((v || 0).toString().replace("R$", "").replace(",", ".").trim());

    const generoBusca = limparTexto(genero);
    const categoriaBusca = limparTexto(categoria);

    const filtrados = produtos.filter(produto => {

      const idadeMin = limparNumero(produto.idade_min);
      const idadeMax = limparNumero(produto.idade_max);
      const precoMax = limparNumero(produto.preco_max);

      const generoProduto = limparTexto(produto.genero);
      const categoriaProduto = limparTexto(produto.categoria);

      const generoValido =
        generoBusca === "unissex"
          ? true
          : generoProduto === generoBusca || generoProduto === "unissex";

      return (
        idade >= idadeMin &&
        idade <= idadeMax &&
        precoMax <= preco &&
        generoValido &&
        categoriaProduto === categoriaBusca
      );
    });

    if (!filtrados.length) {
      resultado.innerHTML = "<p>Nenhuma sugestão encontrada.</p>";
      return;
    }

    resultado.innerHTML = "";

    filtrados.slice(0,5).forEach(produto => {
      resultado.innerHTML += `
        <div class="card">
          ${produto.imagem ? `<img src="${produto.imagem}" alt="${produto.nome}">` : ""}
          <div class="card-content">
            <h3>${produto.nome}</h3>
            <p>${produto.descricao || ""}</p>
            <p><strong>Até R$ ${produto.preco_max}</strong></p>

            <a href="${produto.link}" target="_blank">
              <button class="buy-btn">Comprar Agora</button>
            </a>

            <div class="share-buttons">
              <span>Compartilhar:</span>
              <div class="buttons-row">
                <button class="whatsapp" onclick="compartilharWhats('${produto.nome}','${produto.link}')">
                  <i class="fab fa-whatsapp"></i>
                </button>

                <button class="facebook" onclick="compartilharFacebook('${produto.link}')">
                  <i class="fab fa-facebook-f"></i>
                </button>

                <button class="copy" onclick="copiarLink('${produto.link}')">
                  <i class="fas fa-link"></i>
                </button>
              </div>
            </div>

          </div>
        </div>
      `;
    });

  } catch (erro) {
    resultado.innerHTML = "<p>Erro ao carregar sugestões.</p>";
  }
}

function compartilharWhats(nome, link) {
  const texto = encodeURIComponent(`Olha esse presente: ${nome} ${link}`);
  window.open(`https://wa.me/?text=${texto}`, "_blank");
}

function compartilharFacebook(link) {
  const url = encodeURIComponent(link);
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, "_blank");
}

function copiarLink(link) {
  navigator.clipboard.writeText(link);
  alert("Link copiado!");
}
</script>

</body>
</html>
