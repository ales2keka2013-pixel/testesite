<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presente Ideal | Descubra o Presente Perfeito</title>

<style>

body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  background: #f8f9fc;
  color: #333;
}

header {
  background: linear-gradient(135deg, #1e1e2f, #3a3a5c);
  color: white;
  padding: 60px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 36px;
}

header p {
  margin-top: 10px;
  font-size: 18px;
  opacity: 0.9;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 30px 20px;
}

.form-box {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  margin-top: -40px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

.main-btn {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border-radius: 8px;
  border: none;
  background: #ff4d4d;
  color: white;
  font-weight: bold;
  cursor: pointer;
  font-size: 16px;
}

.main-btn:hover {
  background: #e63c3c;
}

.card {
  background: white;
  margin-top: 25px;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.05);
  display: flex;
  gap: 20px;
  align-items: center;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-4px);
}

.card img {
  width: 140px;
  border-radius: 10px;
}

.card-content {
  flex: 1;
}

.badge {
  background: #28a745;
  color: white;
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 5px;
  display: inline-block;
  margin-bottom: 8px;
}

.buy-btn {
  padding: 10px 16px;
  background: #1e1e2f;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.buy-btn:hover {
  background: #000;
}

footer {
  text-align: center;
  padding: 30px;
  font-size: 14px;
  color: #777;
}

@media(max-width: 768px) {
  .card {
    flex-direction: column;
    text-align: center;
  }

  .card img {
    width: 100%;
    max-width: 250px;
  }
}

</style>
</head>

<body>

<header>
  <h1>🎁 Encontre o Presente Ideal</h1>
  <p>Descubra sugestões perfeitas baseadas em idade, estilo e orçamento</p>
</header>

<div class="container">

<div class="form-box">

<input type="number" id="idade" placeholder="Idade">

<select id="genero">
  <option value="">Gênero</option>
  <option value="masculino">Masculino</option>
  <option value="feminino">Feminino</option>
  <option value="unissex">Unissex</option>
</select>

<select id="categoria">
  <option value="">Categoria</option>
  <option value="tecnologia">Tecnologia</option>
  <option value="livros">Livros</option>
  <option value="esportes">Esportes</option>
</select>

<select id="preco">  
  <option value="100">Até R$100</option>
  <option value="200">Até R$200</option>
  <option value="500">Até R$500</option>
</select>

<button class="main-btn" onclick="buscar()">Encontrar Presente</button>

</div>

<div id="resultado"></div>

</div>

<footer>
  © 2026 Presente Ideal • Este site pode conter links de afiliado.
</footer>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwV-N476BVfkBkokYt1Brwf8rBKRNYdOK-4AowKEHdfa0lnVLTMIQFQOg1O0K8Ms6dZ/exec";

async function buscar() {

  const idade = parseInt(document.getElementById("idade").value);
  const genero = document.getElementById("genero").value;
  const categoria = document.getElementById("categoria").value;
  const preco = parseInt(document.getElementById("preco").value);

  const resultado = document.getElementById("resultado");
  resultado.innerHTML = "Buscando sugestões...";

  try {

    const response = await fetch(API_URL);
    const produtos = await response.json();

    // FILTRO CORRETO
    const filtrados = produtos.filter(produto => {

  const idadeMin = Number(produto.idade_min);
  const idadeMax = Number(produto.idade_max);
  const precoMax = Number(produto.preco_max);

  console.log("Testando produto:", produto.nome);
  console.log("Idade OK?", idade >= idadeMin && idade <= idadeMax);
  console.log("Preço OK?", precoMax <= preco);
  console.log("Genero OK?", produto.genero === genero || produto.genero === "unissex");
  console.log("Categoria OK?", produto.categoria === categoria);

  return (
    idade >= idadeMin &&
    idade <= idadeMax &&
    precoMax <= preco &&
    (produto.genero === genero || produto.genero === "unissex") &&
    produto.categoria === categoria
  );
});
    if (filtrados.length === 0) {
      resultado.innerHTML = "Nenhuma sugestão encontrada.";
      return;
    }

    resultado.innerHTML = "";

    filtrados.forEach((produto, index) => {

      resultado.innerHTML += `
        <div class="card">
          
          ${produto.imagem ? `<img src="${produto.imagem}">` : ""}

          <div class="card-content">

            ${index === 0 ? `<div class="badge">Mais recomendado</div>` : ""}

            <h3>${produto.nome}</h3>
            
            <p>${produto.descricao}</p>
            
            <p><strong>Até R$ ${produto.preco_max}</strong></p>
            
            ${produto.link ? `
              <a href="${produto.link}" target="_blank">
                <button class="buy-btn">Comprar Agora</button>
              </a>
            ` : ""}

          </div>

        </div>
      `;
    });

  } catch (erro) {
    console.error(erro);
    resultado.innerHTML = "Erro ao carregar sugestões.";
  }

}

</script>

</body>
</html>
